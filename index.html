<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coisas pessoais</title>
<meta name="theme-color" content="#F1F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A1F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="saude/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F2;--card:#FFFFFF;--tx:#1C2B33;--mut:#64737B;--tape:#F2B632;--line:#D5DDDF}
@media (prefers-color-scheme:dark){:root{--bg:#141A1F;--card:#1C242A;--tx:#E3E9EC;--mut:#93A2A9;--tape:#F2C14E;--line:#2D383F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:40px 16px}
h1{font:700 40px/1 'Barlow Condensed','Arial Narrow',sans-serif;margin:0 0 6px}
h1::after{content:"";display:inline-block;width:28px;height:8px;background:var(--tape);margin-left:10px;vertical-align:middle}
p.sub{color:var(--mut);margin:0 0 28px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li a{display:flex;gap:16px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
li a:hover,li a:focus-visible{background:var(--card);outline:none;box-shadow:inset 4px 0 0 var(--tape)}
li img{width:48px;height:48px;border-radius:10px;flex:none}
li b{display:block;font:600 19px Barlow,sans-serif}
li span{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Coisas pessoais</h1>
  <p class="sub">Ferramentas de casa. Cada uma pede o próprio login.</p>
  <ul>
    <li><a href="saude/"><img src="saude/icone-192.png" alt=""><div><b>Saúde</b><span>Peso, balança, treinos do relógio, diário e remédio</span></div></a></li>
    <!-- Próximas ferramentas: copie a linha acima, com a pasta e o ícone de cada uma. -->
  </ul>
</main>
</body>
</html>
